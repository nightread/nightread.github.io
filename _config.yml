# Site settings
title: NightRead Support
description: Choose Soft gray, Black, or Warm for Safari on iPhone and iPad with NightRead 2.0.
baseurl: ""
url: "https://nightread.github.io"

# Keep release details consistent across the public pages.
nightread:
  version: "2.0"
  us_price: "US$0.99"
  minimum_ios: "17.0"
  app_store_url: "https://apps.apple.com/app/id6754076823"

# Build settings
markdown: kramdown
highlighter: rouge
theme: minima
header_pages:
  - index.md
  - privacy.md
  - support.md

# Collections
collections:
  docs:
    output: true
    permalink: /:collection/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Exclude from processing
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# SEO
author: NightRead Team
social:
  name: NightRead
  links:
    - https://github.com/nightread/nightread-support
